name: Scorecard

# OpenSSF Scorecard checks the repository's supply-chain practices and
# publishes the result to scorecard.dev, which serves the README badge.
# Publishing needs a public repository. Not a required check.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  branch_protection_rule:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # read workflow runs for the CI-Tests check
      security-events: write # upload the results to code scanning
      id-token: write # publish the results to scorecard.dev
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: results.sarif
