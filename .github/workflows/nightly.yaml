name: Nightly

# Checks whose result changes without a commit: new vulnerability reports
# against unchanged dependencies, and fuzzing, which finds more the longer it
# runs. Not a required check; a failure here opens no PR and blocks nothing.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
        with:
          cache: true
          cache_key_prefix: mise-v2
      - run: govulncheck ./...

  fuzz:
    name: Fuzz
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
        with:
          cache: true
          cache_key_prefix: mise-v2
      - run: mise run fuzz
      # A failing input is written to testdata/fuzz/<FuzzName>/ next to the
      # test; keep it so it can be reproduced and committed as a regression.
      - name: Upload failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/"
          if-no-files-found: ignore
          retention-days: 30
