name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste access tokens, Authorization headers, tool arguments or tool results.
        Describe them instead, or redact them. Tool names and counts are fine.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal code sample, if possible.
  - type: input
    id: version
    attributes:
      label: mcp-toolsearch-proxy version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version
      placeholder: go1.27.3
